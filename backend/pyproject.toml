[project]
name = "backend"
version = "0.1.0"
description = "영상노트 백엔드"
requires-python = ">=3.12"
dependencies = [
    "av>=14,<14.3",
    "edge-tts>=7.2.8",
    "fastapi>=0.142.2",
    "faster-whisper>=1.2.1",
    "imagehash>=4.3.2",
    "numpy>=2.5.3",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12>=9.27.0.42",
    "pillow>=12.3.0",
    "playwright>=1.63.0",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.32",
    "python-pptx>=1.0.2",
    "pywebview>=6.2.1",
    "trafilatura>=2.3.1",
    "uvicorn>=0.54.0",
    "yt-dlp>=2026.8.19",
]

[dependency-groups]
dev = [
    "reportlab>=5.0.1",
]

